  title: "Decennial Symposium"
  lede: "Ten years of the Dynamics of Living Systems group."
  venue: "CCTB, University of Würzburg"
  address: "Klara-Oppenheimer-Weg 32, 97074 Würzburg, Germany"
  map_url: "https://www.openstreetmap.org/search?query=Klara-Oppenheimer-Weg%2032%2C%2097074%20W%C3%BCrzburg"
  founded: 2016
  intro: >
    From 14 to 16 September 2026 the group is celebrating its tenth anniversary
    with a three-day symposium. Several alumni will be present. The talks and
    round-table discussions are open to all.
  invitation: "We earnestly welcome you to join."

days:

  # ── Monday ────────────────────────────────────────────────────────────────
  - id: monday
    weekday: "Monday"
    date_display: "14 September"
    theme: "Honest science"
    blurb: >
      A full day of talks and discussions, in a format we are calling
      <em>honest science</em>. Besides the work itself, we discuss the intrinsic
      and extrinsic motivations of what you do and why you do it. A round-table
      discussion gathers the open problems and the general concepts currently
      circulating in the field. The day ends with a group dinner.
    sessions:
      - { start: "08:30", end: "09:00", type: logistics, label: "Setup" }

      - start: "09:00"
        end: "09:30"
        type: talk
        speakers: [{ member: nikhil-sharma }]
        title: "Evolutionary graph theory: past, present, and future"
        abstract: ""

      - start: "09:30"
        end: "10:00"
        type: talk
        speakers: [{ member: vasudha-kulkarni }]
        title: "Pathogen Spread and Removal in Ant Social Networks"
        abstract: "Social insect colonies face a trade-off: dense interaction networks enable sophisticated coordination but also facilitate rapid disease spread. Ants have evolved allogrooming as a form of cooperative defence, where individuals mechanically remove fungal spores from nestmates, thereby reducing infection risk for recipients but potentially increasing helper exposure. Through the use of marker-based tracking of individuals in social insect colonies, we can obtain social networks based on proximity, to model and experimentally confirm disease spread. Since such networks aggregate multiple behaviours that differ in their likely effect on transmission and removal of pathogenic particles, we here use a multilayer approach to split up traditional proximity networks into different layers. Using garden ants and their natural fungal pathogen, Metarhizium, as an experimental study system, we identify interacting ants with individual markers. We also observe their grooming interactions to obtain a two-layer network based on spatial proximity and their dyadic grooming interactions. We quantify pathogen load on all ants at the end of the experiment. In parallel, we model how pathogen spread is affected by spatial ant-to-ant contact and their grooming interactions, with the latter contributing to both the transfer and removal of pathogens. To capture the natural transmission mode of the fungal pathogen, we model spore spread using diffusion dynamics on two-layer networks, while incorporating a novel degree-dependent negative term to capture grooming-mediated removal. We hereby study disease dynamics in systems where social interactions both transmit and eliminate pathogens, as under social immunity."

      - start: "10:00"
        end: "10:30"
        type: talk
        speakers:
          - name: "Sabine Fischer"
            affiliation: "CCTB, University of Würzburg"
        title: "Computational Biology of spatial interactions in multicellular systems"
        abstract: ""

